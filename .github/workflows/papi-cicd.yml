
name: Process API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 and Maven authentication
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: anypoint-exchange-v3
          server-username: ANYPOINT_MAVEN_USERNAME
          server-password: ANYPOINT_MAVEN_PASSWORD

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Check Maven version
        run: mvn -version

      - name: Restore secure.yaml
        shell: bash
        env:
          MULE_SECURE_YAML: ${{ secrets.MULE_SECURE_YAML }}
        run: |
          mkdir -p src/main/resources/properties

          if [ -z "$MULE_SECURE_YAML" ]; then
            echo "ERROR: MULE_SECURE_YAML secret is missing or empty"
            exit 1
          fi

          printf '%s\n' "$MULE_SECURE_YAML" \
            > src/main/resources/properties/secure.yaml

          chmod 600 src/main/resources/properties/secure.yaml

          echo "secure.yaml restored successfully"

      - name: Verify secure YAML resource
        shell: bash
        run: |
          test -s src/main/resources/properties/secure.yaml || {
            echo "ERROR: secure.yaml is missing or empty"
            exit 1
          }

          echo "Secure YAML file exists"

      - name: Validate secure YAML
        shell: bash
        run: |
          ruby -e '
            require "yaml"
            path = "src/main/resources/properties/secure.yaml"
            data = YAML.load_file(path)
            abort "Invalid secure YAML mapping" unless data.is_a?(Hash)
            puts "Secure YAML syntax is valid"
          '

      - name: Build and run MUnit tests
        shell: bash
        env:
          ANYPOINT_MAVEN_USERNAME: "~~~Client~~~"
          ANYPOINT_MAVEN_PASSWORD: "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
          MULE_SECURE_KEY: ${{ secrets.MULE_SECURE_KEY }}
          MAVEN_OPTS: -Xmx2048m
        run: |
          if [ -z "$MULE_SECURE_KEY" ]; then
            echo "ERROR: MULE_SECURE_KEY secret is missing"
            exit 1
          fi

          mvn -B clean verify \
            -Dsecure.key="$MULE_SECURE_KEY"

      - name: Upload MUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papi-munit-reports
          path: |
            target/surefire-reports/
            target/munit-reports/
            target/site/munit/
          if-no-files-found: ignore

          deploy:

    needs: build-and-test

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 and Maven authentication
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: anypoint-connected-app
          server-username: ANYPOINT_MAVEN_USERNAME
          server-password: ANYPOINT_MAVEN_PASSWORD

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Restore secure.yaml
        shell: bash
        env:
          MULE_SECURE_YAML: ${{ secrets.MULE_SECURE_YAML }}
        run: |
          mkdir -p src/main/resources/properties

          printf '%s\n' "$MULE_SECURE_YAML" \
            > src/main/resources/properties/secure.yaml

       - name: Deploy to CloudHub 2.0
        env:
          ANYPOINT_MAVEN_USERNAME: "~~~Client~~~"
          ANYPOINT_MAVEN_PASSWORD: "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
          MULE_SECURE_KEY: ${{ secrets.MULE_SECURE_KEY }}

          SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}

          MAVEN_OPTS: -Xmx2048m

        run: |
          mvn -B clean deploy \
            -DskipMunitTests \
            -Dsecure.key="$MULE_SECURE_KEY" \
            -Dsalesforce.clientId="$SALESFORCE_CLIENT_ID" \
            -Dsalesforce.clientSecret="$SALESFORCE_CLIENT_SECRET"
